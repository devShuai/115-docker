name: CI and GHCR

# main builds publish edge; a release tag vX.Y.Z publishes X.Y.Z (and X.Y, X, latest
# when stable) plus a GitHub release. scripts/version.py decides the tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify dependencies and source
        run: |
          python3 scripts/vendor.py
          python3 scripts/build-agent-skill.py --check --zip .ci-artifacts/115-download.skill.zip
          bash -n runtime/*.sh scripts/ci-smoke.sh
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q runtime scripts
          node --check runtime/downloader/static/app.js
          node --test tests/*.mjs
      - name: Upload installable agent skill
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 115-download-skill
          path: .ci-artifacts/115-download.skill.zip
          if-no-files-found: error
          retention-days: 90

  image:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      channel: ${{ steps.image.outputs.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set image identity
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "candidate=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          python3 scripts/version.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --image "$name" --github-output
          if [ -n "$RELEASE_TAG" ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$RELEASE_TAG is not on main; releases are cut from main"
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.candidate }}
          build-args: APP_VERSION=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both desktops, scaling, performance and login persistence
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.candidate }}
        run: |
          mkdir -p .ci-artifacts
          docker run --rm --init --shm-size=1g --entrypoint /bin/bash \
            -e CI_BACKENDS=legacy,kasm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace "$CANDIDATE_IMAGE" scripts/ci-smoke.sh
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          CANDIDATE: ${{ steps.image.outputs.candidate }}
          CHANNEL: ${{ steps.image.outputs.channel }}
          VERSION: ${{ steps.image.outputs.version }}
          TAGS: ${{ steps.image.outputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker push "$IMAGE:$CANDIDATE"
          if [ "$CHANNEL" = edge ]; then
            docker tag "$IMAGE:$CANDIDATE" "$IMAGE:sha-$GITHUB_SHA"
            docker push "$IMAGE:sha-$GITHUB_SHA"
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$main_sha" != "$GITHUB_SHA" ]; then
              echo "Published verified sha-$GITHUB_SHA; main has advanced, edge unchanged." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          for reference in $TAGS; do
            docker tag "$IMAGE:$CANDIDATE" "$reference"
            docker push "$reference"
          done
          docker buildx imagetools inspect "${TAGS%% *}"
          echo "Verified image $VERSION: $TAGS (revision $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish GitHub release
        env:
          CHANNEL: ${{ needs.image.outputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build-agent-skill.py --check --zip .ci-artifacts/115-download.skill.zip
          python3 scripts/version.py --notes "$GITHUB_REF_NAME" > release-notes.md
          prerelease=()
          if [ "$CHANNEL" = prerelease ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${prerelease[@]}" \
            .ci-artifacts/115-download.skill.zip
