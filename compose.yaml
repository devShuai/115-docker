name: browser115

services:
  browser115:
    image: ${IMAGE_115:-115-browser-local:36.0.1}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    init: true
    user: "0:0"
    shm_size: ${SHM_SIZE:-1gb}
    mem_limit: ${MEM_LIMIT:-4g}
    cpus: ${CPU_LIMIT:-2.0}
    pids_limit: 512
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-1150}:1150"
    environment:
      REMOTE_BACKEND: ${REMOTE_BACKEND:-kasm}
      REMOTE_USER: ${REMOTE_USER:-115}
      VNC_FPS: ${VNC_FPS:-30}
      KASM_THREADS: ${KASM_THREADS:-2}
      KASM_WEBP_BUDGET: ${KASM_WEBP_BUDGET:-0}
      PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env; see .env.example for backend password rules}
      AUTO_START: ${AUTO_START:-true}
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1600}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-900}
      TZ: ${TZ:-Asia/Shanghai}
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      UPDATE_URL: ${UPDATE_URL:-}
      ENABLE_COOKIE_EXTENSION: ${ENABLE_COOKIE_EXTENSION:-false}
      COOKIE_CID: ${COOKIE_CID:-}
      COOKIE_SEID: ${COOKIE_SEID:-}
      COOKIE_UID: ${COOKIE_UID:-}
      COOKIE_KID: ${COOKIE_KID:-}
    volumes:
      - type: bind
        source: ${PROFILE_DIR:-./data/profile}
        target: /etc/115
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOAD_DIR:-./data/downloads}
        target: /opt/Downloads
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python3
        - /opt/115/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
