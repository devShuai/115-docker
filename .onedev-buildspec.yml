version: 53
jobs:
- name: validate
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
  - type: CommandStep
    name: verify archives and runtime
    runInContainer: true
    image: python:3.13-slim-trixie
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -euo pipefail
        python3 scripts/vendor.py
        bash -n runtime/*.sh scripts/ci-smoke.sh
        python3 -m unittest discover -s tests -v
        python3 -m py_compile scripts/ci-rfb.py scripts/ci-desktop.py scripts/cdp.py scripts/check-update.py runtime/prepare-display.py
    runAs: '0:0'
    useTTY: false
    condition: SUCCESSFUL
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxRetries: 0
  retryDelay: 30
  timeout: 900
- name: publish-image
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
  - type: BuildImageStep
    name: build and push candidate
    output:
      type: RegistryOutput
      tags: registry.devshuai.com/shuai-repo/115-docker:build-@build_number@ registry.devshuai.com/shuai-repo/115-docker:sha-@commit_hash@
    registryLogins:
    - registryUrl: registry.devshuai.com
      userName: '@secret:registry-username@'
      passwordSecret: registry-password
    platforms: linux/amd64
    moreOptions: --label org.opencontainers.image.source=https://one.devshuai.com/shuai-toys/115-docker --label org.opencontainers.image.revision=@commit_hash@
    condition: SUCCESSFUL
  - type: CommandStep
    name: compare both backends and verify actual browser resize
    runInContainer: true
    image: registry.devshuai.com/shuai-repo/115-docker:build-@build_number@
    registryLogins:
    - registryUrl: registry.devshuai.com
      userName: '@secret:registry-username@'
      passwordSecret: registry-password
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: CI_BACKENDS=legacy,kasm bash scripts/ci-smoke.sh
    runAs: '0:0'
    useTTY: false
    condition: SUCCESSFUL
  - type: PublishArtifactStep
    name: publish performance results and desktop screenshots
    artifacts: '.ci-artifacts/**'
    condition: ALWAYS
  - type: RunImagetoolsStep
    name: promote verified image to latest
    arguments: create -t registry.devshuai.com/shuai-repo/115-docker:latest registry.devshuai.com/shuai-repo/115-docker:build-@build_number@
    registryLogins:
    - registryUrl: registry.devshuai.com
      userName: '@secret:registry-username@'
      passwordSecret: registry-password
    condition: SUCCESSFUL
  - type: RunImagetoolsStep
    name: inspect published latest manifest
    arguments: inspect registry.devshuai.com/shuai-repo/115-docker:latest
    registryLogins:
    - registryUrl: registry.devshuai.com
      userName: '@secret:registry-username@'
      passwordSecret: registry-password
    condition: SUCCESSFUL
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  jobDependencies:
  - jobName: validate
    requireSuccessful: true
    artifacts: ''
  sequentialGroup: '@project_path@:registry-publish'
  retryCondition: never
  maxRetries: 0
  retryDelay: 30
  timeout: 3600
